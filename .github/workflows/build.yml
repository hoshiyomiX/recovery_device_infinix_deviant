name: Build OrangeFox Recovery R11.3 (32MB Optimized)

on:
  push:
    branches: [ fox_12.1-final ]
  pull_request:
    branches: [ fox_12.1-final ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'With cache /out'
        type: choice
        options:
          - With cache /out
          # - Without cache /out  # Temporarily disabled

env:
  FOX_MAINTAINER_PATCH_VERSION: 1
  DEVICE: deviant
  PLATFORM: mt6785
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Free disk space
      uses: hoshiyomiX/aggressive-disk-cleaner@main

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          ccache libxml2-utils xsltproc unzip python3 rsync \
          libssl-dev libncurses5-dev bc lzop

    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global color.ui auto

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-latest
        restore-keys: ccache-${{ env.DEVICE }}-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/ccache
        ccache -M 30G
        ccache -z

    - name: Cache build output
      if: github.event.inputs.build_type == 'With cache /out'
      uses: actions/cache@v4
      with:
        path: ~/OrangeFox/fox_12.1/out
        key: out-${{ env.DEVICE }}-latest
        restore-keys: out-${{ env.DEVICE }}-

    - name: Sync OrangeFox source
      run: |
        echo "=== Creating OrangeFox directories ==="
        mkdir -p $HOME/OrangeFox/fox_12.1
        cd $HOME/OrangeFox

        echo "=== Cloning OrangeFox sync script ==="
        git clone https://gitlab.com/OrangeFox/sync.git sync --depth=1
        cd sync

        echo "=== Running OrangeFox sync (branch 12.1) ==="
        ./orangefox_sync.sh --branch 12.1 --path $HOME/OrangeFox/fox_12.1

        echo "=== Verifying build directory ==="
        ls -la $HOME/OrangeFox/
        ls -la $HOME/OrangeFox/fox_12.1/ 2>/dev/null || echo "ERROR: fox_12.1 directory not found!"

        echo "=== Checking for build/envsetup.sh ==="
        if [ -f "$HOME/OrangeFox/fox_12.1/build/envsetup.sh" ]; then
          echo "✓ build/envsetup.sh found!"
        else
          echo "ERROR: build/envsetup.sh NOT found!"
          exit 1
        fi

    - name: Clone device tree
      run: |
        echo "=== Device tree setup ==="
        cd $HOME/OrangeFox/fox_12.1
        rm -rf device/infinix/${{ env.DEVICE }} 2>/dev/null || true
        mkdir -p device/infinix

        echo "=== Cloning device tree from ${{ github.repository }} ==="
        git clone https://github.com/${{ github.repository }}.git device/infinix/${{ env.DEVICE }} -b fox_12.1-final --depth=1

        echo "=== Verifying device tree ==="
        ls -la device/infinix/${{ env.DEVICE }}/

    - name: Run pre-build hook (size reduction)
      run: |
        echo "=== RUNNING PRE-BUILD HOOK ==="

        FOX_SRC="$HOME/OrangeFox/fox_12.1"
        DEVICE_TREE="$GITHUB_WORKSPACE"

        if [ -f "$DEVICE_TREE/pre_build_hook.sh" ]; then
          echo "Found pre_build_hook.sh"
          chmod +x "$DEVICE_TREE/pre_build_hook.sh"

          # Execute pre-build hook
          source "$DEVICE_TREE/pre_build_hook.sh" "$FOX_SRC"
        else
          echo "WARNING: pre_build_hook.sh not found"
        fi

    - name: Building recovery
      run: |
        cd $HOME/OrangeFox/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_DIR=/tmp/ccache
        set -e

        BUILD_TYPE="${{ github.event.inputs.build_type || 'Without cache /out' }}"

        lunch twrp_${{ env.DEVICE }}-eng

        if [ "$BUILD_TYPE" = "With cache /out" ]; then
          echo "=== Build with cached /out ==="
        else
          echo "=== Build without cached /out (Fresh) ==="
          make clean
        fi

        mka adbd bootimage -j$(nproc --all)

        ccache -s
      continue-on-error: true

    - name: Verify boot image size
      run: |
        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"

        if [ -f "$BOOT_IMG" ]; then
          SIZE=$(stat -c %s "$BOOT_IMG")
          SIZE_MB=$(( SIZE / 1024 / 1024 ))
          TARGET=33554432
          TARGET_MB=32

          echo "=== BOOT IMAGE SIZE CHECK ==="
          echo "Actual size: $SIZE bytes ($SIZE_MB MB)"
          echo "Target size: $TARGET bytes ($TARGET_MB MB)"

          if [ $SIZE -le $TARGET ]; then
            echo ""
            echo "✓ SUCCESS! Boot image fits in 32MB partition"
            echo "  Margin: $(( TARGET - SIZE )) bytes ($(( (TARGET - SIZE) / 1024 )) KB)"
          else
            echo ""
            echo "✗ FAILED! Boot image still too large"
            echo "  Overflow: $(( SIZE - TARGET )) bytes ($(( (SIZE - TARGET) / 1024 )) KB)"
            exit 1
          fi
        else
          echo "ERROR: boot.img not found"
          exit 1
        fi

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.3-${{ env.DEVICE }}-32mb
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
        if-no-files-found: error

    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-error-log
        path: |
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/obj/PACKAGING/**/*.log
        retention-days: 3
        if-no-files-found: ignore
