name: Build OrangeFox Recovery R11.3 (32MB Optimized)

on:
  push:
    branches: [ fox_12.1-final ]
  pull_request:
    branches: [ fox_12.1-final ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'With cache /out'
        type: choice
        options:
          - With cache /out
          - Without cache /out

env:
  DEVICE: deviant
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Free disk space
      uses: hoshiyomiX/aggressive-disk-cleaner@main

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          ccache libxml2-utils xsltproc unzip python3 rsync \
          libssl-dev libncurses5-dev bc lzop \
          android-tools-adb android-tools-fastboot \
          cpio

    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Get current week
      id: get-date
      run: echo "week=$(date -u '+%Y-W%W')" >> $GITHUB_OUTPUT

    - name: Cache OrangeFox source
      uses: actions/cache@v4
      id: cache-source
      with:
        path: |
          ~/OrangeFox/fox_12.1/.repo
          ~/OrangeFox/fox_12.1/bootable
          ~/OrangeFox/fox_12.1/build
          ~/OrangeFox/fox_12.1/system
          ~/OrangeFox/fox_12.1/vendor
          ~/OrangeFox/fox_12.1/external
          ~/OrangeFox/fox_12.1/frameworks
          ~/OrangeFox/fox_12.1/hardware
          ~/OrangeFox/fox_12.1/packages
          ~/OrangeFox/fox_12.1/art
          ~/OrangeFox/fox_12.1/bionic
          ~/OrangeFox/fox_12.1/dalvik
          ~/OrangeFox/fox_12.1/libcore
          ~/OrangeFox/fox_12.1/libnativehelper
          ~/OrangeFox/fox_12.1/pdk
          ~/OrangeFox/fox_12.1/prebuilts
          ~/OrangeFox/fox_12.1/sdk
          ~/OrangeFox/fox_12.1/tools
        key: fox-source-12.1-${{ runner.os }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          fox-source-12.1-${{ runner.os }}-
          fox-source-12.1-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          ccache-${{ env.DEVICE }}-
          ccache-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/ccache
        ccache -M 30G
        ccache -z

    - name: Cache build output
      if: github.event.inputs.build_type == 'With cache /out'
      uses: actions/cache@v4
      with:
        path: ~/OrangeFox/fox_12.1/out
        key: out-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          out-${{ env.DEVICE }}-
          out-

    - name: Sync OrangeFox source
      run: |
        echo "=== Creating OrangeFox directories ==="
        mkdir -p $HOME/OrangeFox/fox_12.1
        cd $HOME/OrangeFox

        echo "=== Cloning OrangeFox sync script ==="
        git clone https://gitlab.com/OrangeFox/sync.git sync --depth=1
        cd sync

        echo "=== Running OrangeFox sync (branch 12.1) ==="
        ./orangefox_sync.sh --branch 12.1 --path $HOME/OrangeFox/fox_12.1

        echo "=== Verifying build directory ==="
        if [ ! -d "$HOME/OrangeFox/fox_12.1" ]; then
          echo "ERROR: fox_12.1 directory not found!"
          exit 1
        fi

        echo "=== Checking for build/envsetup.sh ==="
        if [ -f "$HOME/OrangeFox/fox_12.1/build/envsetup.sh" ]; then
          echo "✓ build/envsetup.sh found!"
        else
          echo "ERROR: build/envsetup.sh NOT found!"
          exit 1
        fi

    - name: Setup device tree
      run: |
        echo "=== Device tree setup ==="
        cd $HOME/OrangeFox/fox_12.1
        mkdir -p device/infinix

        echo "=== Copying device tree from workspace ==="
        cp -r "$GITHUB_WORKSPACE" device/infinix/${{ env.DEVICE }}

        echo "=== Verifying device tree ==="
        if [ ! -f "device/infinix/${{ env.DEVICE }}/BoardConfig.mk" ]; then
          echo "ERROR: BoardConfig.mk not found in device tree!"
          exit 1
        fi
        ls -la device/infinix/${{ env.DEVICE }}/

    - name: Building recovery
      id: build
      run: |
        cd $HOME/OrangeFox/fox_12.1

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_DIR=/tmp/ccache
        set -e

        BUILD_TYPE="${{ github.event.inputs.build_type || 'With cache /out' }}"

        lunch twrp_${{ env.DEVICE }}-eng

        if [ "$BUILD_TYPE" = "Without cache /out" ]; then
          echo "=== Build without cached /out (Fresh) ==="
          make clean
        else
          echo "=== Build with cached /out ==="
        fi

        mka adbd bootimage -j$(nproc --all)

        ccache -s

        # Verify build success
        BOOT_IMG="out/target/product/${{ env.DEVICE }}/boot.img"
        if [ ! -f "$BOOT_IMG" ]; then
          echo "ERROR: boot.img not built!"
          exit 1
        fi
        echo "✓ boot.img built successfully"
        echo "boot_img_path=$HOME/OrangeFox/fox_12.1/$BOOT_IMG" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Install magiskboot
      run: |
        echo "=== Installing magiskboot ==="
        # Download latest Magisk APK
        MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/latest"
        MAGISK_VERSION=$(curl -sL "$MAGISK_URL" | grep -oP 'tag/v\K[0-9.]+' | head -1)
        echo "Magisk version: $MAGISK_VERSION"

        # Download Magisk APK
        curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk" -o magisk.apk

        # Extract magiskboot
        unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot
        sudo mv magiskboot /usr/local/bin/

        # Verify installation
        if [ -x /usr/local/bin/magiskboot ]; then
          echo "✓ magiskboot installed successfully"
        else
          echo "✗ magiskboot installation failed"
          exit 1
        fi

    - name: Post-build cleanup & size verification
      run: |
        echo "=== POST-BUILD CLEANUP WITH MAGISKBOOT ==="
        echo "Target: Remove unused files to fit 32MB boot partition"
        echo ""

        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"
        TARGET=33554432

        if [ ! -f "$BOOT_IMG" ]; then
          echo "ERROR: boot.img not found at $BOOT_IMG"
          exit 1
        fi

        ORIG_SIZE=$(stat -c %s "$BOOT_IMG")
        echo "Original boot.img size: $ORIG_SIZE bytes ($((ORIG_SIZE/1024/1024)) MB)"
        echo ""

        # Create working directory
        WORK_DIR=$(mktemp -d)
        cd "$WORK_DIR"

        echo "=== [1/4] Unpacking boot image ==="
        cp "$BOOT_IMG" boot.img
        magiskboot unpack -h boot.img
        echo ""

        echo "=== [2/4] Removing unused libraries ==="
        echo "Removing:"
        echo "  - libchrome.so (Chrome/V8 engine, not used by recovery)"
        echo "  - libxml2.so (not used by anyone)"
        echo "  - libnl.so (netlink library, not needed for recovery)"
        echo "  - libunwindstack.so (debug/stack unwinding)"
        echo "  - libbacktrace.so (debug/backtrace)"
        echo "  - libclang_rt.ubsan*.so (UndefinedBehaviorSanitizer, debug only)"
        echo "  - libcppbor.so (CBOR parsing, orphan)"
        echo "  - libevent.so (event library, orphan)"
        echo "  - android.system.wifi.keystore@1.0.so (WiFi keystore, not needed)"
        echo "  - sbin/magiskboot (already bundled in flashable zip)"
        echo ""

        # Remove libraries
        LIBRARIES_TO_REMOVE=(
            "system/lib64/libchrome.so"
            "system/lib64/libxml2.so"
            "system/lib64/libnl.so"
            "system/lib64/libunwindstack.so"
            "system/lib64/libbacktrace.so"
            "system/lib64/libclang_rt.ubsan_standalone-aarch64-android.so"
            "system/lib64/libcppbor.so"
            "system/lib64/libevent.so"
            "system/lib64/android.system.wifi.keystore@1.0.so"
            "sbin/magiskboot"
        )

        for lib in "${LIBRARIES_TO_REMOVE[@]}"; do
            echo "  Removing: $lib"
            magiskboot cpio ramdisk.cpio "rm $lib" 2>/dev/null || true
        done

        echo ""
        echo "=== [3/4] Cleaning terminfo ==="
        echo "Keeping only essential terminfo: linux, vt100, vt102, xterm, xterm-256color"
        echo ""

        # Extract terminfo files we want to keep
        mkdir -p terminfo_keep/l terminfo_keep/v terminfo_keep/x

        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/l/linux terminfo_keep/l/linux" 2>/dev/null || true
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt100 terminfo_keep/v/vt100" 2>/dev/null || true
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt102 terminfo_keep/v/vt102" 2>/dev/null || true
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm terminfo_keep/x/xterm" 2>/dev/null || true
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color" 2>/dev/null || true

        # Remove entire terminfo directory
        magiskboot cpio ramdisk.cpio "rm -r system/etc/terminfo" 2>/dev/null || true

        # Recreate terminfo with only essential files
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/l"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/v"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/x"

        [ -f terminfo_keep/l/linux ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/l/linux terminfo_keep/l/linux"
        [ -f terminfo_keep/v/vt100 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt100 terminfo_keep/v/vt100"
        [ -f terminfo_keep/v/vt102 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt102 terminfo_keep/v/vt102"
        [ -f terminfo_keep/x/xterm ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm terminfo_keep/x/xterm"
        [ -f terminfo_keep/x/xterm-256color ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color"

        echo ""
        echo "=== [4/4] Repacking boot image ==="
        magiskboot repack boot.img new-boot.img

        # Replace original with optimized
        cp new-boot.img "$BOOT_IMG"

        # Show size comparison
        NEW_SIZE=$(stat -c %s new-boot.img)
        SAVED=$((ORIG_SIZE - NEW_SIZE))

        echo ""
        echo "=============================================="
        echo "          SIZE COMPARISON SUMMARY"
        echo "=============================================="
        echo "  Original: $ORIG_SIZE bytes ($((ORIG_SIZE/1024/1024)) MB)"
        echo "  New:      $NEW_SIZE bytes ($((NEW_SIZE/1024/1024)) MB)"
        echo "  Saved:    $SAVED bytes ($((SAVED/1024)) KB)"
        echo "  Target:   $TARGET bytes (32 MB)"
        echo "=============================================="
        echo ""

        if [ $NEW_SIZE -le $TARGET ]; then
          MARGIN=$(( TARGET - NEW_SIZE ))
          echo "✓ SUCCESS! Boot image fits in 32MB partition"
          echo "  Margin: $MARGIN bytes ($(( MARGIN / 1024 )) KB)"
          echo ""
          echo "=== POST-BUILD CLEANUP COMPLETE ==="
        else
          OVERFLOW=$(( NEW_SIZE - TARGET ))
          echo "✗ FAILED! Boot image still too large"
          echo "  Overflow: $OVERFLOW bytes ($(( OVERFLOW / 1024 )) KB)"
          exit 1
        fi

        # Cleanup
        cd /
        rm -rf "$WORK_DIR"

    - name: Upload boot image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.3-${{ env.DEVICE }}-32mb
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
        if-no-files-found: error

    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-error-log
        path: |
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/obj/PACKAGING/**/*.log
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/*.log
        retention-days: 3
        if-no-files-found: ignore
