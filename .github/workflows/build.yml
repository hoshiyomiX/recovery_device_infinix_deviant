name: Build OrangeFox Recovery R11.3 (32MB Optimized)

on:
  push:
    branches: [ fox_12.1-final ]
  pull_request:
    branches: [ fox_12.1-final ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'Fresh build'
        type: choice
        options:
          - Fresh build
          - Clean build
      force_refresh_cache:
        description: 'Force refresh all caches (ignore existing cache)'
        required: false
        default: false
        type: boolean

env:
  DEVICE: deviant
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Free disk space
      uses: hoshiyomiX/aggressive-disk-cleaner@main

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          ccache libxml2-utils xsltproc unzip python3 rsync \
          libssl-dev libncurses5-dev bc lzop \
          android-tools-adb android-tools-fastboot \
          cpio

    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Get current week
      id: get-date
      run: echo "week=$(date -u '+%Y-W%W')" >> $GITHUB_OUTPUT

    - name: Cache ccache
      if: github.event.inputs.force_refresh_cache != 'true'
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          ccache-${{ env.DEVICE }}-
          ccache-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/ccache
        ccache -M 10G
        ccache -z

    - name: Sync OrangeFox source
      run: |
        echo "=== Syncing OrangeFox source ==="
        mkdir -p $HOME/OrangeFox/fox_12.1
        mkdir -p $HOME/OrangeFox/sync
        cd $HOME/OrangeFox/sync
        git clone https://gitlab.com/OrangeFox/sync.git . --depth=1
        ./orangefox_sync.sh --branch 12.1 --path $HOME/OrangeFox/fox_12.1

    - name: Setup device tree
      run: |
        cd $HOME/OrangeFox/fox_12.1
        mkdir -p device/infinix
        cp -r "$GITHUB_WORKSPACE" device/infinix/${{ env.DEVICE }}

    - name: Building recovery
      id: build
      run: |
        cd $HOME/OrangeFox/fox_12.1

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_DIR=/tmp/ccache
        set -e

        BUILD_TYPE="${{ github.event.inputs.build_type || 'Fresh build' }}"

        lunch twrp_${{ env.DEVICE }}-eng

        if [ "$BUILD_TYPE" = "Clean build" ]; then
          echo "=== Clean build ==="
          make clean
        else
          echo "=== Fresh build ==="
        fi

        mka adbd bootimage -j$(nproc --all)

        ccache -s

        # Verify build success
        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"
        if [ ! -f "$BOOT_IMG" ]; then
          echo "ERROR: boot.img not built!"
          exit 1
        fi
        echo "✓ boot.img built successfully at $BOOT_IMG"
      continue-on-error: true

    - name: Check build status
      if: steps.build.outcome == 'failure'
      run: |
        echo "❌ Build failed!"
        exit 1

    - name: Show ccache stats
      id: ccache-stats
      run: |
        echo "=============================================="
        echo "          CCACHE STATISTICS"
        echo "=============================================="
        ccache -s 2>/dev/null || true
        echo "=============================================="
      continue-on-error: true

    - name: Save ccache
      uses: actions/cache/save@v4
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}

    - name: Upload original boot image
      uses: actions/upload-artifact@v4
      with:
        name: boot-img-original
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7

    - name: Install magiskboot
      run: |
        MAGISK_VERSION=$(curl -sL "https://github.com/topjohnwu/Magisk/releases/latest" | grep -oP 'tag/v\K[0-9.]+' | head -1)
        curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk" -o magisk.apk
        unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot
        sudo mv magiskboot /usr/local/bin/

    - name: Post-build cleanup & size verification
      run: |
        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"
        TARGET=33554432
        WORK_DIR=$(mktemp -d)
        cd "$WORK_DIR"
        
        echo "=== [1/9] Unpacking boot image ==="
        cp "$BOOT_IMG" boot.img
        magiskboot unpack -h boot.img
        RAMDISK_BEFORE=$(stat -c %s ramdisk.cpio)
        echo "Ramdisk BEFORE: $RAMDISK_BEFORE bytes ($((RAMDISK_BEFORE/1024)) KB)"
        
        echo "=== [2/9] Removing unused libraries ==="
        for lib in system/lib64/libchrome.so system/lib64/libxml2.so system/lib64/libnl.so \
                   system/lib64/libunwindstack.so system/lib64/libbacktrace.so \
                   system/lib64/libclang_rt.ubsan_standalone-aarch64-android.so \
                   system/lib64/libcppbor.so system/lib64/libevent.so \
                   system/lib64/android.system.wifi.keystore@1.0.so sbin/magiskboot; do
          magiskboot cpio ramdisk.cpio "rm $lib" 2>/dev/null && echo "  ✓ $lib"
        done
        
        echo "=== [3/9] Cleaning terminfo (keep essential) ==="
        mkdir -p terminfo_keep/l terminfo_keep/v terminfo_keep/x
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/l/linux terminfo_keep/l/linux" 2>/dev/null
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt100 terminfo_keep/v/vt100" 2>/dev/null
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt102 terminfo_keep/v/vt102" 2>/dev/null
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm terminfo_keep/x/xterm" 2>/dev/null
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color" 2>/dev/null
        magiskboot cpio ramdisk.cpio "rm -r system/etc/terminfo" 2>/dev/null
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo" 2>/dev/null
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/l" 2>/dev/null
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/v" 2>/dev/null
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/x" 2>/dev/null
        [ -f terminfo_keep/l/linux ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/l/linux terminfo_keep/l/linux"
        [ -f terminfo_keep/v/vt100 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt100 terminfo_keep/v/vt100"
        [ -f terminfo_keep/v/vt102 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt102 terminfo_keep/v/vt102"
        [ -f terminfo_keep/x/xterm ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm terminfo_keep/x/xterm"
        [ -f terminfo_keep/x/xterm-256color ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color"
        echo "Kept: linux, vt100, vt102, xterm, xterm-256color"
        
        echo "=== [4/9] Removing extra themes (keep Default) ==="
        for theme in Black Cinnamon DBlack DCinnamon DFox DGoogle DGreen DLollipop DOcean DOrchid DPurple DRed DSpace DYellow Fox Google Green Light Lollipop Night Ocean Orchid Purple Red Space Splash Yellow; do
          magiskboot cpio ramdisk.cpio "rm -r twres/images/$theme" 2>/dev/null
        done
        echo "Themes removed (kept: Default)"
        
        echo "=== [5/9] Removing extra fonts (keep Roboto-Regular.ttf) ==="
        for font in Amatic.ttf Chococooky.ttf EuclidFlex-Medium.ttf EuclidFlex-Regular.ttf \
                    Exo2-Medium.ttf Exo2-Regular.ttf FiraCode-Medium.ttf FiraCode-Regular.ttf \
                    GoogleSans-Medium.ttf GoogleSans-Regular.ttf MILanPro-Medium.ttf MILanPro-Regular.ttf \
                    RobotoSlab.ttf Roboto-Medium.ttf; do
          magiskboot cpio ramdisk.cpio "rm twres/fonts/$font" 2>/dev/null
        done
        echo "Fonts removed (kept: Roboto-Regular.ttf)"
        
        echo "=== [6/9] Removing extra languages (keep en.xml) ==="
        for lang in cs.xml de.xml el.xml fr.xml id.xml it.xml pl.xml pt_PT.xml ro.xml ru.xml tr.xml ua.xml; do
          magiskboot cpio ramdisk.cpio "rm twres/languages/$lang" 2>/dev/null
        done
        echo "Languages removed (kept: en.xml)"
        
        echo "=== [7/9] Removing documentation ==="
        for doc in ramdisk-files.sha256sum ramdisk-files.txt twres/credits.txt twres/changelog.txt twres/translators.txt; do
          magiskboot cpio ramdisk.cpio "rm $doc" 2>/dev/null
        done
        
        echo "=== [8/9] Removing non-critical tools ==="
        # === KEEP ALL TA FILES INTACT - Required for TEE functionality ===
        # === nano excluded via TW_EXCLUDE_NANO, BusyBox vi is used instead ===

        # Remove nano editor - BusyBox has vi
        magiskboot cpio ramdisk.cpio "rm -r FFiles/nano" 2>/dev/null && echo "  ✓ Removed nano editor (BusyBox has vi)"
        magiskboot cpio ramdisk.cpio "rm sbin/nano" 2>/dev/null

        # Remove ps binary - BusyBox provides ps
        magiskboot cpio ramdisk.cpio "rm FFiles/ps" 2>/dev/null && echo "  ✓ Removed ps binary (BusyBox has ps)"

        # Unused tools (BusyBox provides alternatives)
        magiskboot cpio ramdisk.cpio "rm system/bin/bc" 2>/dev/null
        magiskboot cpio ramdisk.cpio "rm system/bin/awk" 2>/dev/null
        
        echo "=== [9/9] Repacking boot image ==="
        REPACK_OUTPUT=$(magiskboot repack boot.img new-boot.img 2>&1)
        KERNEL_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'KERNEL_SZ\s*\[\K[0-9]+' | tail -1)
        RAMDISK_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'RAMDISK_SZ\s*\[\K[0-9]+' | tail -1)
        DTB_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'DTB_SZ\s*\[\K[0-9]+' | tail -1)
        DTB_SZ=${DTB_SZ:-0}
        
        PAGE_SIZE=2048
        KERNEL_PADDED=$(( ((KERNEL_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        RAMDISK_PADDED=$(( ((RAMDISK_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        DTB_PADDED=$(( ((DTB_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        TOTAL_SIZE=$((PAGE_SIZE + KERNEL_PADDED + RAMDISK_PADDED + DTB_PADDED))
        
        truncate -s $TOTAL_SIZE new-boot.img
        cp new-boot.img "$BOOT_IMG"
        
        NEW_SIZE=$(stat -c %s new-boot.img)
        ORIG_SIZE=$(stat -c %s boot.img)
        RAMDISK_AFTER=$(stat -c %s ramdisk.cpio)
        
        echo ""
        echo "=============================================="
        echo "          SIZE COMPARISON SUMMARY"
        echo "=============================================="
        echo "  Original boot.img: 64 MB"
        echo "  New boot.img:      $((NEW_SIZE/1024/1024)) MB"
        echo "  Target:            32 MB"
        echo "  Ramdisk saved:     $(( (RAMDISK_BEFORE - RAMDISK_AFTER) / 1024 )) KB"
        echo "=============================================="
        echo ""
        
        if [ $NEW_SIZE -le $TARGET ]; then
          MARGIN=$(( TARGET - NEW_SIZE ))
          echo "✓ SUCCESS! Boot image fits in 32MB partition (Margin: $((MARGIN/1024)) KB)"
        else
          OVERFLOW=$(( NEW_SIZE - TARGET ))
          echo "✗ FAILED! Overflow: $((OVERFLOW/1024)) KB"
          exit 1
        fi
        
        cd /
        rm -rf "$WORK_DIR"

    - name: Upload boot image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.3-${{ env.DEVICE }}-32mb
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
