name: Build OrangeFox Recovery R11.3 (32MB Optimized)

on:
  push:
    branches: [ fox_12.1-final ]
  pull_request:
    branches: [ fox_12.1-final ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'With cache /out'
        type: choice
        options:
          - With cache /out
          - Without cache /out
      force_refresh_cache:
        description: 'Force refresh all caches (ignore existing cache)'
        required: false
        default: false
        type: boolean

env:
  DEVICE: deviant
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Free disk space
      uses: hoshiyomiX/aggressive-disk-cleaner@main

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          ccache libxml2-utils xsltproc unzip python3 rsync \
          libssl-dev libncurses5-dev bc lzop \
          android-tools-adb android-tools-fastboot \
          cpio

    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Get current week
      id: get-date
      run: echo "week=$(date -u '+%Y-W%W')" >> $GITHUB_OUTPUT

    - name: Cache OrangeFox source
      if: github.event.inputs.force_refresh_cache != 'true'
      uses: actions/cache@v4
      id: cache-source
      with:
        path: ~/OrangeFox/fox_12.1
        key: fox-source-12.1-${{ steps.get-date.outputs.week }}
        restore-keys: |
          fox-source-12.1-

    - name: Cache ccache
      if: github.event.inputs.force_refresh_cache != 'true'
      uses: actions/cache@v4
      id: cache-ccache
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          ccache-${{ env.DEVICE }}-
          ccache-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/ccache
        ccache -M 30G
        ccache -z

    - name: Cache build output
      if: github.event.inputs.force_refresh_cache != 'true'
      uses: actions/cache@v4
      id: cache-out
      with:
        path: ~/OrangeFox/fox_12.1/out
        key: out-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}
        restore-keys: |
          out-${{ env.DEVICE }}-
          out-

    - name: Sync OrangeFox source
      id: sync-source
      if: |
        steps.cache-source.outputs.cache-hit != 'true' || 
        github.event.inputs.force_refresh_cache == 'true'
      run: |
        echo "=== Source cache miss or force refresh - syncing... ==="
        echo "=== Creating OrangeFox directories ==="
        mkdir -p $HOME/OrangeFox/fox_12.1
        mkdir -p $HOME/OrangeFox/sync
        cd $HOME/OrangeFox/sync

        echo "=== Cloning OrangeFox sync script ==="
        git clone https://gitlab.com/OrangeFox/sync.git . --depth=1

        echo "=== Running OrangeFox sync (branch 12.1) ==="
        ./orangefox_sync.sh --branch 12.1 --path $HOME/OrangeFox/fox_12.1

        echo "=== Verifying build directory ==="
        if [ ! -d "$HOME/OrangeFox/fox_12.1" ]; then
          echo "ERROR: fox_12.1 directory not found!"
          exit 1
        fi

        echo "=== Checking for build/envsetup.sh ==="
        if [ -f "$HOME/OrangeFox/fox_12.1/build/envsetup.sh" ]; then
          echo "✓ build/envsetup.sh found!"
        else
          echo "ERROR: build/envsetup.sh NOT found!"
          exit 1
        fi
        echo "source_synced=true" >> $GITHUB_OUTPUT

    - name: Source cache hit info
      if: |
        steps.cache-source.outputs.cache-hit == 'true' && 
        github.event.inputs.force_refresh_cache != 'true'
      run: |
        echo "✓ Source cache HIT - skipping sync"
        echo "Cache key: fox-source-12.1-${{ steps.get-date.outputs.week }}"
        ls -la $HOME/OrangeFox/fox_12.1/ 2>/dev/null || echo "Source directory exists"

    - name: Save OrangeFox source cache
      if: steps.sync-source.outputs.source_synced == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/OrangeFox/fox_12.1
        key: fox-source-12.1-${{ steps.get-date.outputs.week }}

    - name: Setup device tree
      run: |
        echo "=== Device tree setup ==="
        cd $HOME/OrangeFox/fox_12.1
        mkdir -p device/infinix

        echo "=== Copying device tree from workspace ==="
        cp -r "$GITHUB_WORKSPACE" device/infinix/${{ env.DEVICE }}

        echo "=== Verifying device tree ==="
        if [ ! -f "device/infinix/${{ env.DEVICE }}/BoardConfig.mk" ]; then
          echo "ERROR: BoardConfig.mk not found in device tree!"
          exit 1
        fi
        ls -la device/infinix/${{ env.DEVICE }}/

    - name: Building recovery
      id: build
      run: |
        cd $HOME/OrangeFox/fox_12.1

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_DIR=/tmp/ccache
        set -e

        BUILD_TYPE="${{ github.event.inputs.build_type || 'With cache /out' }}"

        lunch twrp_${{ env.DEVICE }}-eng

        if [ "$BUILD_TYPE" = "Without cache /out" ]; then
          echo "=== Build without cached /out (Fresh) ==="
          make clean
        else
          echo "=== Build with cached /out ==="
        fi

        mka adbd bootimage -j$(nproc --all)

        ccache -s

        # Verify build success
        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"
        if [ ! -f "$BOOT_IMG" ]; then
          echo "ERROR: boot.img not built!"
          exit 1
        fi
        echo "✓ boot.img built successfully at $BOOT_IMG"
      continue-on-error: true

    - name: Check build status
      if: steps.build.outcome == 'failure'
      run: |
        echo "❌ Build failed! Check build logs for details."
        exit 1

    - name: Save ccache
      uses: actions/cache/save@v4
      with:
        path: /tmp/ccache
        key: ccache-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}

    - name: Save build output
      uses: actions/cache/save@v4
      with:
        path: ~/OrangeFox/fox_12.1/out
        key: out-${{ env.DEVICE }}-${{ steps.get-date.outputs.week }}

    - name: Upload original boot image (before cleanup)
      uses: actions/upload-artifact@v4
      with:
        name: boot-img-original
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
        if-no-files-found: error

    - name: Install magiskboot
      run: |
        echo "=== Installing magiskboot ==="
        # Download latest Magisk APK
        MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/latest"
        MAGISK_VERSION=$(curl -sL "$MAGISK_URL" | grep -oP 'tag/v\K[0-9.]+' | head -1)
        echo "Magisk version: $MAGISK_VERSION"

        # Download Magisk APK
        curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk" -o magisk.apk

        # Extract magiskboot
        unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot
        sudo mv magiskboot /usr/local/bin/

        # Verify installation
        if [ -x /usr/local/bin/magiskboot ]; then
          echo "✓ magiskboot installed successfully"
        else
          echo "✗ magiskboot installation failed"
          exit 1
        fi

    - name: Post-build cleanup & size verification
      run: |
        echo "=== POST-BUILD CLEANUP WITH MAGISKBOOT ==="
        echo "Target: Remove unused files to fit 32MB boot partition"
        echo ""

        BOOT_IMG="$HOME/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img"
        TARGET=33554432

        if [ ! -f "$BOOT_IMG" ]; then
          echo "ERROR: boot.img not found at $BOOT_IMG"
          exit 1
        fi

        ORIG_SIZE=$(stat -c %s "$BOOT_IMG")
        echo "Original boot.img size: $ORIG_SIZE bytes ($((ORIG_SIZE/1024/1024)) MB)"
        echo ""

        # Create working directory
        WORK_DIR=$(mktemp -d)
        cd "$WORK_DIR"

        echo "=== [1/7] Unpacking boot image ==="
        cp "$BOOT_IMG" boot.img
        if ! magiskboot unpack -h boot.img; then
          echo "ERROR: Failed to unpack boot.img"
          exit 1
        fi
        echo ""

        # Check ramdisk size BEFORE cleanup
        RAMDISK_SIZE_BEFORE=$(stat -c %s ramdisk.cpio 2>/dev/null || echo "0")
        echo "Ramdisk.cpio size BEFORE cleanup: $RAMDISK_SIZE_BEFORE bytes ($((RAMDISK_SIZE_BEFORE/1024)) KB)"
        echo ""

        echo "=== [2/7] Analyzing ramdisk contents ==="
        echo "Listing files in ramdisk.cpio (first 100 lines):"
        magiskboot cpio ramdisk.cpio ls 2>/dev/null | head -100
        echo ""
        
        echo "Counting total files in ramdisk:"
        TOTAL_FILES=$(magiskboot cpio ramdisk.cpio ls 2>/dev/null | wc -l)
        echo "Total files: $TOTAL_FILES"
        echo ""

        echo "=== [3/7] Removing unused libraries ==="
        LIBRARIES_TO_REMOVE=(
            "system/lib64/libchrome.so"
            "system/lib64/libxml2.so"
            "system/lib64/libnl.so"
            "system/lib64/libunwindstack.so"
            "system/lib64/libbacktrace.so"
            "system/lib64/libclang_rt.ubsan_standalone-aarch64-android.so"
            "system/lib64/libcppbor.so"
            "system/lib64/libevent.so"
            "system/lib64/android.system.wifi.keystore@1.0.so"
            "sbin/magiskboot"
        )

        REMOVED_COUNT=0
        for lib in "${LIBRARIES_TO_REMOVE[@]}"; do
            # Check if file exists in ramdisk using 'exists' command
            if magiskboot cpio ramdisk.cpio "exists $lib" 2>/dev/null; then
                echo "  ✓ Found & removing: $lib"
                magiskboot cpio ramdisk.cpio "rm $lib" 2>/dev/null
                REMOVED_COUNT=$((REMOVED_COUNT + 1))
            else
                echo "  - Not found: $lib"
            fi
        done
        echo ""
        echo "Total libraries removed: $REMOVED_COUNT"
        echo ""

        echo "=== [4/7] Removing non-essential binaries ==="
        BINARIES_TO_REMOVE=(
            "system/bin/update_engine_sideload"
            "system/bin/fastbootd"
        )

        BIN_REMOVED_COUNT=0
        for bin in "${BINARIES_TO_REMOVE[@]}"; do
            if magiskboot cpio ramdisk.cpio "exists $bin" 2>/dev/null; then
                echo "  ✓ Found & removing: $bin"
                magiskboot cpio ramdisk.cpio "rm $bin" 2>/dev/null
                BIN_REMOVED_COUNT=$((BIN_REMOVED_COUNT + 1))
            else
                echo "  - Not found: $bin"
            fi
        done
        echo ""
        echo "Total binaries removed: $BIN_REMOVED_COUNT"
        echo ""

        echo "=== [5/7] Cleaning terminfo ==="
        echo "Extracting essential terminfo files..."
        mkdir -p terminfo_keep/l terminfo_keep/v terminfo_keep/x

        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/l/linux terminfo_keep/l/linux" 2>/dev/null || echo "  linux: not found"
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt100 terminfo_keep/v/vt100" 2>/dev/null || echo "  vt100: not found"
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/v/vt102 terminfo_keep/v/vt102" 2>/dev/null || echo "  vt102: not found"
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm terminfo_keep/x/xterm" 2>/dev/null || echo "  xterm: not found"
        magiskboot cpio ramdisk.cpio "extract system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color" 2>/dev/null || echo "  xterm-256color: not found"

        echo "Files extracted for keeping:"
        ls -la terminfo_keep/*/ 2>/dev/null || echo "  No terminfo files found"
        echo ""

        echo "Removing entire terminfo directory..."
        magiskboot cpio ramdisk.cpio "rm -r system/etc/terminfo" 2>/dev/null || echo "  terminfo directory not found"

        echo "Recreating terminfo with essential files only..."
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/l"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/v"
        magiskboot cpio ramdisk.cpio "mkdir 0755 system/etc/terminfo/x"

        [ -f terminfo_keep/l/linux ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/l/linux terminfo_keep/l/linux" && echo "  + linux"
        [ -f terminfo_keep/v/vt100 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt100 terminfo_keep/v/vt100" && echo "  + vt100"
        [ -f terminfo_keep/v/vt102 ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/v/vt102 terminfo_keep/v/vt102" && echo "  + vt102"
        [ -f terminfo_keep/x/xterm ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm terminfo_keep/x/xterm" && echo "  + xterm"
        [ -f terminfo_keep/x/xterm-256color ] && magiskboot cpio ramdisk.cpio "add 0644 system/etc/terminfo/x/xterm-256color terminfo_keep/x/xterm-256color" && echo "  + xterm-256color"
        echo ""

        echo "=== [6/7] Removing extra themes (keeping only Default) ==="
        echo "Listing current themes in twres/images..."
        
        # List all theme directories
        THEMES=$(magiskboot cpio ramdisk.cpio ls 2>/dev/null | grep -E "^drwx.*twres/images/[^/]+$" || true)
        echo "Found themes: $THEMES"
        
        # Remove each theme directory except Default
        THEMES_TO_REMOVE=(
            "twres/images/Black"
            "twres/images/Cinnamon"
            "twres/images/DBlack"
            "twres/images/DCinnamon"
            "twres/images/DFox"
            "twres/images/DGoogle"
            "twres/images/DGreen"
            "twres/images/DLollipop"
            "twres/images/DOcean"
            "twres/images/DOrchid"
            "twres/images/DPurple"
            "twres/images/DRed"
            "twres/images/DSpace"
            "twres/images/DYellow"
            "twres/images/Fox"
            "twres/images/Google"
            "twres/images/Green"
            "twres/images/Light"
            "twres/images/Lollipop"
            "twres/images/Night"
            "twres/images/Ocean"
            "twres/images/Orchid"
            "twres/images/Purple"
            "twres/images/Red"
            "twres/images/Space"
            "twres/images/Splash"
            "twres/images/Yellow"
        )
        
        THEMES_REMOVED=0
        for theme in "${THEMES_TO_REMOVE[@]}"; do
            if magiskboot cpio ramdisk.cpio "exists $theme" 2>/dev/null; then
                echo "  ✓ Removing theme: $theme"
                magiskboot cpio ramdisk.cpio "rm -r $theme" 2>/dev/null
                THEMES_REMOVED=$((THEMES_REMOVED + 1))
            fi
        done
        echo ""
        echo "Total themes removed: $THEMES_REMOVED (keeping Default only)"
        echo ""

        echo "Files remaining in ramdisk:"
        NEW_TOTAL=$(magiskboot cpio ramdisk.cpio ls 2>/dev/null | wc -l)
        echo "Total files after cleanup: $NEW_TOTAL (removed: $((TOTAL_FILES - NEW_TOTAL)))"
        echo ""

        # Check ramdisk size AFTER cleanup
        RAMDISK_SIZE_AFTER=$(stat -c %s ramdisk.cpio 2>/dev/null || echo "0")
        RAMDISK_SAVED=$((RAMDISK_SIZE_BEFORE - RAMDISK_SIZE_AFTER))
        echo "Ramdisk.cpio size AFTER cleanup: $RAMDISK_SIZE_AFTER bytes ($((RAMDISK_SIZE_AFTER/1024)) KB)"
        echo "Ramdisk saved: $RAMDISK_SAVED bytes ($((RAMDISK_SAVED/1024)) KB)"
        echo ""

        if [ "$RAMDISK_SAVED" -le 0 ]; then
          echo "⚠ WARNING: Ramdisk size did not decrease! Cleanup may not have worked."
          echo "This could mean:"
          echo "  1. Target files don't exist in ramdisk"
          echo "  2. Files are in different locations"
          echo "  3. Ramdisk is compressed (need to decompress first)"
        fi
        echo ""

        echo "=== [7/7] Repacking boot image ==="
        echo "Input boot.img size: $ORIG_SIZE bytes ($((ORIG_SIZE/1024/1024)) MB)"
        echo "Input ramdisk.cpio size: $RAMDISK_SIZE_AFTER bytes ($((RAMDISK_SIZE_AFTER/1024)) KB)"
        echo ""
        
        # Repack and capture output to get actual sizes
        if ! REPACK_OUTPUT=$(magiskboot repack boot.img new-boot.img 2>&1); then
          echo "ERROR: Failed to repack boot.img"
          echo "$REPACK_OUTPUT"
          exit 1
        fi
        echo "$REPACK_OUTPUT"
        echo ""
        
        # Extract actual sizes from repack output (use tail -1 to get REPACK sizes, not UNPACK)
        KERNEL_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'KERNEL_SZ\s*\[\K[0-9]+' | tail -1)
        RAMDISK_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'RAMDISK_SZ\s*\[\K[0-9]+' | tail -1)
        DTB_SZ=$(echo "$REPACK_OUTPUT" | grep -oP 'DTB_SZ\s*\[\K[0-9]+' | tail -1)
        
        # Validate and set defaults
        if [ -z "$KERNEL_SZ" ] || [ -z "$RAMDISK_SZ" ]; then
          echo "ERROR: Failed to extract KERNEL_SZ or RAMDISK_SZ from repack output"
          echo "KERNEL_SZ: $KERNEL_SZ"
          echo "RAMDISK_SZ: $RAMDISK_SZ"
          exit 1
        fi
        
        # DTB is optional, default to 0
        DTB_SZ=${DTB_SZ:-0}
        
        echo "Extracted sizes:"
        echo "  KERNEL_SZ:  $KERNEL_SZ bytes"
        echo "  RAMDISK_SZ: $RAMDISK_SZ bytes"
        echo "  DTB_SZ:     $DTB_SZ bytes"
        echo ""
        
        # Calculate padded sizes (align to page size 2048)
        PAGE_SIZE=2048
        KERNEL_PADDED=$(( ((KERNEL_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        RAMDISK_PADDED=$(( ((RAMDISK_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        DTB_PADDED=$(( ((DTB_SZ + PAGE_SIZE - 1) / PAGE_SIZE) * PAGE_SIZE ))
        TOTAL_SIZE=$((PAGE_SIZE + KERNEL_PADDED + RAMDISK_PADDED + DTB_PADDED))
        
        echo "Padded sizes (page-aligned to $PAGE_SIZE bytes):"
        echo "  Kernel padded:  $KERNEL_PADDED bytes"
        echo "  Ramdisk padded: $RAMDISK_PADDED bytes"
        echo "  DTB padded:     $DTB_PADDED bytes"
        echo "  Total:          $TOTAL_SIZE bytes ($((TOTAL_SIZE/1024/1024)) MB)"
        echo ""
        
        # Truncate to actual size (remove padding from original)
        echo "Truncating new-boot.img to actual content size..."
        truncate -s $TOTAL_SIZE new-boot.img
        
        # Replace original with optimized
        cp new-boot.img "$BOOT_IMG"

        # Show size comparison
        NEW_SIZE=$(stat -c %s new-boot.img)
        SAVED=$((ORIG_SIZE - NEW_SIZE))

        echo ""
        echo "=============================================="
        echo "          SIZE COMPARISON SUMMARY"
        echo "=============================================="
        echo "  Original: $ORIG_SIZE bytes ($((ORIG_SIZE/1024/1024)) MB)"
        echo "  New:      $NEW_SIZE bytes ($((NEW_SIZE/1024/1024)) MB)"
        echo "  Saved:    $SAVED bytes ($((SAVED/1024)) KB)"
        echo "  Target:   $TARGET bytes (32 MB)"
        echo "=============================================="
        echo ""

        if [ $NEW_SIZE -le $TARGET ]; then
          MARGIN=$(( TARGET - NEW_SIZE ))
          echo "✓ SUCCESS! Boot image fits in 32MB partition"
          echo "  Margin: $MARGIN bytes ($(( MARGIN / 1024 )) KB)"
          echo ""
          echo "=== POST-BUILD CLEANUP COMPLETE ==="
        else
          OVERFLOW=$(( NEW_SIZE - TARGET ))
          echo "✗ FAILED! Boot image still too large"
          echo "  Overflow: $OVERFLOW bytes ($(( OVERFLOW / 1024 )) KB)"
          exit 1
        fi

        # Cleanup
        cd /
        rm -rf "$WORK_DIR"

    - name: Upload boot image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.3-${{ env.DEVICE }}-32mb
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
        if-no-files-found: error

    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-error-log
        path: |
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/obj/PACKAGING/**/*.log
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/*.log
        retention-days: 3
        if-no-files-found: ignore
