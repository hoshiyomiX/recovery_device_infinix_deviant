name: Build OrangeFox Recovery R11.3

on:
  push:
    branches: [ fox_11 ]
  pull_request:
    branches: [ fox_11 ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'Fresh Build'
        type: choice
        options:
          - Fresh Build
          - Quick Rebuild

env:
  FOX_MAINTAINER_PATCH_VERSION: R11.3
  DEVICE: deviant
  PLATFORM: mt6785

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    - name: Free disk space
      uses: hoshiyomiX/aggressive-disk-cleaner@main

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z-dev ccache libgl1-mesa-dev \
          libxml2-utils xsltproc unzip python3 python3-pip \
          rsync libssl-dev libncurses5-dev

    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global color.ui auto

    - name: Check cached OrangeFox source
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/OrangeFox/fox_12.1
        key: orangefox-fox_12.1-${{ github.run_id }}
        restore-keys: orangefox-fox_12.1-

    - name: Sync OrangeFox source
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        echo "=== Creating OrangeFox directories ==="
        mkdir -p $HOME/OrangeFox/fox_12.1
        cd $HOME/OrangeFox

        echo "=== Cloning OrangeFox sync script ==="
        git clone https://gitlab.com/OrangeFox/sync.git sync --depth=1
        cd sync

        echo "=== Running OrangeFox sync (branch 12.1) ==="
        ./orangefox_sync.sh --branch 12.1 --path $HOME/OrangeFox/fox_12.1

        echo "=== Verifying build directory ==="
        ls -la $HOME/OrangeFox/
        ls -la $HOME/OrangeFox/fox_12.1/ 2>/dev/null || echo "ERROR: fox_12.1 directory not found!"

        echo "=== Checking for build/envsetup.sh ==="
        if [ -f "$HOME/OrangeFox/fox_12.1/build/envsetup.sh" ]; then
          echo "✓ build/envsetup.sh found!"
        else
          echo "ERROR: build/envsetup.sh NOT found!"
          echo "=== Directory structure: ==="
          find $HOME/OrangeFox/fox_12.1 -maxdepth 2 -type d 2>/dev/null | head -20
          exit 1
        fi

    - name: Save OrangeFox source to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/OrangeFox/fox_12.1
        key: orangefox-fox_12.1-${{ github.run_id }}

    - name: Verify OrangeFox source
      run: |
        echo "=== OrangeFox source directory size ==="
        du -sh $HOME/OrangeFox/fox_12.1 2>/dev/null || echo "ERROR: Directory not found!"
        echo "=== Checking for build/envsetup.sh ==="
        if [ -f "$HOME/OrangeFox/fox_12.1/build/envsetup.sh" ]; then
          echo "✓ OrangeFox source ready!"
        else
          echo "ERROR: build/envsetup.sh NOT found!"
          exit 1
        fi

    - name: Clone device tree
      run: |
        echo "=== Device tree setup ==="
        cd $HOME/OrangeFox/fox_12.1
        rm -rf device/infinix/${{ env.DEVICE }} 2>/dev/null || true
        mkdir -p device/infinix

        echo "=== Cloning device tree from ${{ github.repository }} ==="
        git clone https://github.com/${{ github.repository }}.git device/infinix/${{ env.DEVICE }} -b fox_11 --depth=1

        echo "=== Verifying device tree ==="
        ls -la device/infinix/${{ env.DEVICE }}/

    - name: Building recovery
      run: |
        cd $HOME/OrangeFox/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ env.DEVICE }}-eng && make clean && mka adbd bootimage -j$(nproc --all)
      continue-on-error: true

    - name: Upload recovery image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.3-${{ env.DEVICE }}
        path: ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/boot.img
        retention-days: 7
        if-no-files-found: warn

    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-error-log
        path: |
          ~/OrangeFox/fox_12.1/out/target/product/${{ env.DEVICE }}/obj/PACKAGING/**/*.log
        retention-days: 3
        if-no-files-found: ignore
