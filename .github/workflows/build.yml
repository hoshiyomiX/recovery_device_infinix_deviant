name: Build OrangeFox Recovery

on:
  push:
    branches:
      - fox-11-*
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches:
      - fox-11-*
  workflow_dispatch:
    inputs:
      fox_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
          - fox_12.1
          - fox_11.0
      clean_build:
        description: 'Clean build (full sync)'
        required: false
        default: false
        type: boolean
      release_build:
        description: 'Create release'
        required: false
        default: false
        type: boolean

env:
  DEVICE: deviant
  VENDOR: infinix

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Set environment variables
        run: |
          echo "DEVICE=deviant" >> $GITHUB_ENV
          echo "VENDOR=infinix" >> $GITHUB_ENV
          FOX_BRANCH="${{ github.event.inputs.fox_branch || 'fox_12.1' }}"
          echo "FOX_BRANCH=$FOX_BRANCH" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> $GITHUB_ENV

      - name: Free Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h /
          echo ""

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/pipx \
            /usr/local/share/chromium /usr/local/share/google-chrome /usr/local/share/microsoft-edge \
            /usr/local/share/firefox /opt/az /usr/lib/azure /var/lib/docker /snap \
            /usr/share/doc /usr/share/man 2>/dev/null || true

          sudo docker system prune -af 2>/dev/null || true
          sudo journalctl --vacuum-time=1s 2>/dev/null || true

          sudo apt-get remove -y --purge azure-cli google-chrome-stable microsoft-edge-stable \
            firefox chromium-browser powershell dotnet-sdk-* 2>/dev/null || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean -y
          sudo rm -rf /var/cache/apt/archives/*

          echo "=== Disk Space After Cleanup ==="
          df -h /
          AVAILABLE_GB=$(df -BG / | awk 'NR==2 {print $4}' | tr -d 'G')
          echo "Available space: ${AVAILABLE_GB}GB"
          if [ "$AVAILABLE_GB" -lt 100 ]; then
            echo "⚠️ WARNING: Less than 100GB available!"
          else
            echo "✅ Sufficient disk space for OrangeFox build"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python3-pip openjdk-11-jdk \
            libncurses-dev libtinfo5

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui auto

      - name: Install repo tool
        run: |
          # Create bin directory
          mkdir -p ~/bin
          
          # Download repo tool
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          # Add to PATH for current session
          echo "$HOME/bin" >> $GITHUB_PATH
          
          # Verify installation
          ~/bin/repo --version || echo "repo version check completed"
          echo "✓ repo tool installed successfully"

      - name: Cache OrangeFox source
        id: cache_source
        uses: actions/cache@v4
        with:
          path: ~/fox
          key: fox-source-${{ env.FOX_BRANCH }}-${{ hashFiles('device_tree/BoardConfig.mk') }}
          restore-keys: |
            fox-source-${{ env.FOX_BRANCH }}-
            fox-source-

      - name: Sync OrangeFox source (Official Method)
        id: sync_source
        run: |
          # Ensure repo is in PATH
          export PATH="$HOME/bin:$PATH"
          
          # Verify repo is available
          if ! command -v repo &> /dev/null; then
            echo "❌ ERROR: repo command not found in PATH"
            echo "PATH: $PATH"
            ls -la ~/bin/ || echo "~/bin not found"
            exit 1
          fi
          echo "✓ repo tool found at: $(which repo)"
          
          # Extract version number from branch (fox_12.1 -> 12.1)
          FOX_VERSION=$(echo "${{ env.FOX_BRANCH }}" | sed 's/fox_//')
          echo "OrangeFox version: $FOX_VERSION"
          
          if [ "${{ steps.cache_source.outputs.cache-hit }}" == "true" ] && [ "${{ github.event.inputs.clean_build }}" != "true" ]; then
            echo "✓ Using cached OrangeFox source"
            if [ ! -d ~/fox ]; then
              echo "⚠️ Cache exists but ~/fox not found, will sync anyway"
              CACHE_HIT="false"
            else
              CACHE_HIT="true"
            fi
          fi
          
          if [ "$CACHE_HIT" != "true" ]; then
            echo "→ Syncing OrangeFox source using official sync script..."
            mkdir -p ~/OrangeFox_sync
            cd ~/OrangeFox_sync
            git clone https://gitlab.com/OrangeFox/sync.git --depth=1
            cd sync
            
            # Run the official sync script
            yes | ./orangefox_sync.sh --branch $FOX_VERSION --path ~/fox
            
            # Verify sync completed successfully
            if [ ! -d ~/fox ]; then
              echo "❌ ERROR: OrangeFox sync failed - ~/fox directory not created"
              exit 1
            fi
            
            echo "✓ OrangeFox source synced successfully"
            ls -la ~/fox/
          fi

      - name: Setup device tree
        run: |
          # Verify fox directory exists
          if [ ! -d ~/fox ]; then
            echo "❌ ERROR: ~/fox directory does not exist!"
            echo "Contents of home directory:"
            ls -la ~/
            exit 1
          fi
          
          cd ~/fox
          mkdir -p device/${{ env.VENDOR }}/${{ env.DEVICE }}
          cp -r $GITHUB_WORKSPACE/device_tree/* device/${{ env.VENDOR }}/${{ env.DEVICE }}/
          
          # Verify device tree
          echo "Device tree contents:"
          ls -la device/${{ env.VENDOR }}/${{ env.DEVICE }}/

      - name: Build OrangeFox Recovery
        run: |
          cd ~/fox
          source build/envsetup.sh
          lunch orfox_${{ env.DEVICE }}-eng
          mka bootimage -j$(nproc --all)

      - name: Prepare artifacts
        run: |
          cd ~/fox
          mkdir -p output
          
          # Copy boot.img (recovery image for A/B devices)
          if [ -f out/target/product/${{ env.DEVICE }}/boot.img ]; then
            cp out/target/product/${{ env.DEVICE }}/boot.img output/
            echo "✓ boot.img found and copied"
          else
            echo "✗ boot.img not found"
          fi
          
          # Copy recovery.img if exists (non A/B devices)
          if [ -f out/target/product/${{ env.DEVICE }}/recovery.img ]; then
            cp out/target/product/${{ env.DEVICE }}/recovery.img output/
            echo "✓ recovery.img found and copied"
          fi
          
          # Generate build info
          cat > output/BUILD_INFO.md << EOF
          ## OrangeFox Recovery Build Information
          
          | Property | Value |
          |----------|-------|
          | Device | ${{ env.DEVICE }} |
          | Variant | X695C/X695D/X695 |
          | OrangeFox Branch | ${{ env.FOX_BRANCH }} |
          | Build Date | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |
          | Commit | ${{ github.sha }} |
          | Build Type | ${{ github.event_name }} |
          
          ### Flashing Instructions
          \`\`\`bash
          # Boot to fastboot mode
          fastboot flash boot_a boot.img
          fastboot flash boot_b boot.img
          fastboot reboot recovery
          \`\`\`
          
          ### Device Support
          - Infinix X695C
          - Infinix X695D  
          - Infinix X695
          EOF
          
          ls -la output/
          
          # Copy to workspace for release upload
          mkdir -p $GITHUB_WORKSPACE/output
          cp -r output/* $GITHUB_WORKSPACE/output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}
          path: ~/fox/output/
          retention-days: 30

      - name: Upload to Release
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/fox-11-deviant') ||
          github.event.inputs.release_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: OrangeFox ${{ env.DEVICE }} ${{ env.BUILD_DATE }}
          body_path: ${{ github.workspace }}/output/BUILD_INFO.md
          files: |
            ${{ github.workspace }}/output/boot.img
            ${{ github.workspace }}/output/recovery.img
            ${{ github.workspace }}/output/BUILD_INFO.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Notify build status
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ needs.build.result }}"
          EMOJI="✅"
          [ "$STATUS" != "success" ] && EMOJI="❌"
          
          MESSAGE="$EMOJI *OrangeFox Build for ${{ env.DEVICE }}*
          
          Status: $STATUS
          Branch: ${{ github.ref_name }}
          Commit: \`${{ github.sha }}\`
          
          [View Build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
